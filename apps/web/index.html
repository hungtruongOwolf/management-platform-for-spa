<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Viên Phúc Y Đường</title>
    <!-- The whole logo, strokes thickened for tab sizes (scripts/brand/build_logo_assets.py).
         `?v=` = ICON_VERSION there: browsers cache favicons past normal cache rules. -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=4" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png?v=4" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser chrome in the app header's maroon (tokens.css --chrome-bg). -->
    <meta name="theme-color" content="#5a1d18" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2b1310" media="(prefers-color-scheme: dark)" />
    <!-- Every route starts by asking who is signed in: fetch it alongside the JS, not after it. -->
    <link rel="preload" href="/api/v1/me" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
