[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
catalog = { version = "0.1.0", path = "../catalog" }
crm = { version = "0.1.0", path = "../crm" }
dotenvy = "0.15.7"
identity = { version = "0.1.0", path = "../identity" }
kernel = { version = "0.1.0", path = "../kernel" }
operations = { version = "0.1.0", path = "../operations" }
org = { version = "0.1.0", path = "../org" }
packages = { version = "0.1.0", path = "../packages" }
sales = { version = "0.1.0", path = "../sales" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "request-id", "timeout", "trace", "util"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["uuid"] }

[dev-dependencies]
catalog = { path = "../catalog" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
crm = { path = "../crm" }
http-body-util = "0.1.5"
identity = { path = "../identity" }
kernel = { path = "../kernel", features = ["testing"] }
org = { path = "../org" }
packages = { path = "../packages" }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
uuid = "1.29.0"
tower = { version = "0.5.3", features = ["util"] }
