[package]
name = "identity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
base64 = "0.23.1"
chrono = "0.4.45"
getrandom = "0.4.3"
kernel = { version = "0.1.0", path = "../kernel" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "ipnetwork"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v7"] }
