[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
identity = { version = "0.1.0", path = "../identity" }
kernel = { version = "0.1.0", path = "../kernel" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "json", "ipnetwork"] }
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
uuid = { version = "1.29.0", features = ["v7"] }
