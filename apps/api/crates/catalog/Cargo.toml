[package]
name = "catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query"] }
identity = { version = "0.1.0", path = "../identity" }
kernel = { version = "0.1.0", path = "../kernel" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "macros"] }
thiserror = "2.0.21"
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = "1.29.0"

[dev-dependencies]
kernel = { path = "../kernel", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
