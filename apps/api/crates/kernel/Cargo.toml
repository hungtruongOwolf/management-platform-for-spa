[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test helpers (app_rw pool, tenant seeding) for this and other crates' integration tests.
testing = []

[dependencies]
aes-gcm = "0.11.1"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64 = "0.23.1"
# Dates and instants (ADR-0026). The IANA zone database is compiled in (`tzdb-bundle-always`) and the
# host's zoneinfo is never read, so a spa's business day does not depend on the server image.
jiff = { version = "1.0.3", default-features = false, features = ["std", "serde", "tzdb-bundle-always", "perf-inline"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "json", "macros", "migrate", "ipnetwork", "sqlx-toml"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
kernel = { path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
