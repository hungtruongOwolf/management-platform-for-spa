# Local prod-like smoke test (infra/prodtest/run.sh). Layered on top of docker-compose.prod.yml:
# a throwaway Postgres 17 (the Supabase major) stands in for Supabase, and backups go to a local volume instead of R2.
services:
  fakedb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FAKEDB_PASSWORD:?set FAKEDB_PASSWORD}
      POSTGRES_DB: vpyd
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro    # relative to infra/ (first -f file); role app_rw, as on Supabase after the runbook SQL
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [default, edge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vpyd"]
      interval: 2s
      retries: 30

  migrate:
    depends_on:
      fakedb:
        condition: service_healthy

  api:
    environment:
      # The stand-in DB has no TLS. Staging-only exemption from the verify-full startup check
      # (app::config::INSECURE_DB_TLS_FLAG); never set it in .env.production.
      APP_DB_INSECURE_TLS_FOR_LOCAL_TEST: "true"

  backup:
    volumes:
      - backups:/work

  restore:
    volumes:
      - backups:/work

volumes:
  backups:
