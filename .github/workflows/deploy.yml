name: Deploy (staging)

# Manual only. Builds the three images from the selected ref, pushes them to GHCR (private), then deploys over SSH.
# Secrets live in the GitHub environment `staging` (Settings > Environments), never in git:
#   STAGING_SSH_HOST         VPS IP or hostname
#   STAGING_SSH_KEY          private key of a deploy-only SSH key (ed25519) for user `deploy`
#   STAGING_SSH_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>` checked against the VPS console
# Application secrets stay in /opt/vpyd/.env.production on the server (runbook: memory/wiki/runbooks/staging-setup.md).
on:
  workflow_dispatch:
    inputs:
      rollback:
        description: "Redeploy the previous tag instead of building this ref"
        type: boolean
        default: false

# Least privilege per job (security review L8): only `build` may push images.
permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/hungtruongowolf

jobs:
  build:
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          push: true
          tags: ${{ env.REGISTRY }}/vpyd-api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Caddy.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/vpyd-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/backup
          push: true
          tags: ${{ env.REGISTRY }}/vpyd-backup:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backup

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.rollback) }}
    runs-on: ubuntu-24.04
    environment: staging
    # The job token is forwarded to the VPS for `docker pull`: it must be read-only.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: SSH setup (pinned host key, no TOFU)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync stack definition
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          tar -cf - infra/docker-compose.prod.yml infra/deploy.sh infra/postgres-init infra/backup \
            | ssh -o StrictHostKeyChecking=yes "deploy@$HOST" 'tar -xf - -C /opt/vpyd && chmod +x /opt/vpyd/infra/deploy.sh'
      - name: Deploy
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then target="--rollback"; else target="$TAG"; fi
          # Short-lived, read-only (packages: read) job token for the pull only; logged out again so nothing long-lived stays on the VPS.
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=yes "deploy@$HOST" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null && /opt/vpyd/infra/deploy.sh $target; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
