name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # gitleaks lists PR commits

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpyd
          POSTGRES_PASSWORD: vpyd_ci_password
          POSTGRES_DB: vpyd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vpyd -d vpyd"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Compile-time query checks use the committed .sqlx data; tests use the live server (one fresh DB per test).
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://vpyd:vpyd_ci_password@localhost:5432/vpyd
      APP_RW_PASSWORD: app_rw_dev_password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime role app_rw
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../infra/postgres-init/01-roles.sql
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: OpenAPI contract is up to date
        run: cargo run -q -p app -- openapi | diff -u openapi.json -
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/api/Cargo.toml
          command: check advisories bans licenses sources

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches openapi.json
        run: pnpm api:types && git diff --exit-code packages/api-client/src/schema.ts
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build
      - run: pnpm audit --prod --audit-level high

  images:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Production compose file is valid
        run: |
          # Fill every empty variable of the documented example with a dummy value, then let compose parse it.
          sed -E 's/^([A-Z0-9_]+)=[[:space:]]*(#.*)?$/\1=x/' infra/.env.production.example > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f infra/docker-compose.prod.yml --profile ops --profile drill config -q
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image (Caddy + SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Caddy.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Backup image
        uses: docker/build-push-action@v6
        with:
          context: infra/backup
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  e2e:
    name: E2E + a11y + perf (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpyd
          POSTGRES_PASSWORD: vpyd_ci_password
          POSTGRES_DB: vpyd_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vpyd -d vpyd_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      SQLX_OFFLINE: "true"
      E2E_DATABASE_URL: postgres://vpyd:vpyd_ci_password@localhost:5432/vpyd_e2e
      E2E_APP_DATABASE_URL: postgres://app_rw:app_rw_dev_password@localhost:5432/vpyd_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Create runtime role app_rw
        run: psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres-init/01-roles.sql
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
          shared-key: e2e
      - name: Build API
        run: cargo build --manifest-path apps/api/Cargo.toml -p app
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E, axe and API p95
        run: pnpm e2e
      - name: Lighthouse CI (LCP < 2.5 s)
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/lighthouse-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: perf-report
          path: |
            apps/web/test-results/**/api-p95.json
            apps/web/lighthouse-report
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
